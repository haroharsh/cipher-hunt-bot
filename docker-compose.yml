services:
  postgres:
    image: postgres:16-alpine
    container_name: cipher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ciphers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciphers"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cipher_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides localhost DATABASE_URL from .env to connect to internal postgres service container
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ciphers
    volumes:
      - ./images:/app/images
      - ./config:/app/config

volumes:
  postgres_data:
